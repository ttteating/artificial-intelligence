name: contract-compliance-search
seed: 42

data:
  raw_dir: data/raw
  split_path: data/split.json
  dev_n: 600              # 与 split.json 的实际 dev 规模一致（此前写 700，脚本并不读它）
  heldout_n: 100
  backend: tfidf          # tfidf | st(sentence-transformers，需额外安装)

search:
  max_depth: 4            # 深度预算（2~4 跳为主，4 为上限）
  max_expansions: 16      # 扩展节点预算（受限预算下启发式优势才显现）
  tau_conf: 0.60          # 目标测试的置信度门槛
  min_clause_cover: 0.6   # 与最优条款相似度 >= 0.6*max 的条款都要审查
  sim_floor: 0.08
  require_exception_resolution: true
  w_h: 1.5                # f = g + w_h · h

mcts:
  n_simulations: 90
  c_ucb: 1.3
  rollout_depth: 2
  reward_cap: 1.0
  aggregation: mean       # mean | median

ga:
  pop: 12
  gens: 9
  k_tour: 3
  pc: 0.9
  eta: 15.0
  pm: 0.35
  sigma: 0.12
  elitism: 1
  dev_n: 300
  lam_exp: 0.5

hybrid:
  lambda_llm: 0.15        # dev 18 组网格最优（logs/lambda_grid.json）
  lambda_clf: 0.30
  lambda_risk: 0.40

llm:
  mode: mock              # off | mock | real
  model: gpt-4o-mini
  hallucination_rate: 0.0
  cache_dir: results/cache/llm
